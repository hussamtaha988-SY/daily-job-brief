    url: "https://www.linkedin.com/search/results/content/?keywords=%28%22administrative%22%20OR%20%22translator%22%29%20AND%20%28%22Dubai%22%20OR%20%22UAE%22%29%20AND%20%28%22hiring%22%20OR%20%22send%20your%20CV%22%20OR%20%22%D8%AA%D9%88%D8%B8%D9%8A%D9%81%22%29&sortBy=%22date_posted%22"
