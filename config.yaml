# ---- Gulf search targets (LinkedIn public search) ----
gulf_locations:
  - {name: "United Arab Emirates", weight: 10, pages: 2}
  - {name: "Saudi Arabia",         weight: 7,  pages: 2}
  - {name: "Qatar",                weight: 6,  pages: 1}
  - {name: "Kuwait",               weight: 5,  pages: 1}
  - {name: "Bahrain",              weight: 5,  pages: 1}
  - {name: "Oman",                 weight: 5,  pages: 1}

# One OR-query per location keeps the request count low, which avoids
# LinkedIn HTTP 429 rate limiting.
gulf_query: 'administrative OR "administrative assistant" OR translator OR translation OR paralegal OR "legal assistant" OR "document controller" OR "office administrator" OR "executive assistant"'
gulf_tpr: "r86400"                  # last 24 hours

remote_query: 'translator OR translation OR "administrative assistant" OR "document controller" OR "legal assistant" OR proofreader OR "content writer"'
remote_tpr: "r604800"               # last 7 days
remote_locations:
  - "Middle East"
  - "Worldwide"

# ---- Free job sources ----
sources:
  linkedin:
    enabled: true
    gulf: true
    remote: true
    details: true                   # open the job page for verified seniority + description
  greenhouse:
    enabled: true
  lever:
    enabled: true
  remotive:
    enabled: true
    url: "https://remotive.com/api/remote-jobs?limit=100"
  remoteok:
    enabled: true
    url: "https://remoteok.com/api"
  himalayas:
    enabled: true
    url: "https://himalayas.app/jobs/api?limit=100"
  jobicy:
    enabled: true
    url: "https://jobicy.com/api/v2/remote-jobs?count=50"
  arbeitnow:
    enabled: true
    url: "https://www.arbeitnow.com/api/job-board-api"
  weworkremotely:
    enabled: true
    feeds:
      - "https://weworkremotely.com/categories/remote-customer-support-jobs.rss"
      - "https://weworkremotely.com/categories/remote-writing-jobs.rss"
      - "https://weworkremotely.com/categories/remote-management-and-finance-jobs.rss"
      - "https://weworkremotely.com/categories/remote-all-other-jobs.rss"

# ---- Direct company career boards (Gulf) --------------------------------
# Stable, key-free, and not rate-limited. Reused from the earlier
# GulfCareer platform; only boards that actually list Gulf roles are kept.
company_boards:
  greenhouse:
    - {slug: "tamara",    name: "Tamara"}
    - {slug: "careem",    name: "Careem"}
    - {slug: "deliveroo", name: "Deliveroo"}
    - {slug: "lokalise",  name: "Lokalise"}
  lever:
    - {slug: "aldar",     name: "Aldar Properties"}
    - {slug: "rws",       name: "RWS (Trados)"}

# ---- Manual search links -------------------------------------------------
# Bayt / GulfTalent / Naukrigulf / Indeed block automated access (HTTP 403),
# so instead of pretending to scrape them we hand over a ready-made search
# link for each. One click, already filtered for your role and location.
portal_links:
  - name: "Bayt.com"
    url: "https://www.bayt.com/en/uae/jobs/administrative-jobs/"
  - name: "GulfTalent"
    url: "https://www.gulftalent.com/uae/jobs/title/administration"
  - name: "Naukrigulf"
    url: "https://www.naukrigulf.com/administrative-jobs-in-uae"
  - name: "Dubizzle Jobs"
    url: "https://dubai.dubizzle.com/jobs/administration/"
  - name: "LinkedIn — Easy Apply"
    url: "https://www.linkedin.com/jobs/search/?keywords=%22administrative%20officer%22%20OR%20%22document%20controller%22%20OR%20translator&location=United%20Arab%20Emirates&f_TPR=r86400&f_AL=true"
  - name: "LinkedIn — منشورات التوظيف"
    url: "https://www.linkedin.com/search/results/content/?keywords=%28%22administrative%22%20OR%20%22translator%22%29%20AND%20%28%22Dubai%22%20OR%20%22UAE%22%29%20AND%20%28%22hiring%22%20OR%20%22send%20your%20CV%22%20OR%20%22%D8%AA%D9%88%D8%B8%D9%8A%D9%81%22%29&sortBy=%22date_posted%22"

# ---- Dedicated professional-translation search --------------------------
# Translation vacancies are fewer than admin ones, so they get their own
# query and a 7-day window, plus reserved slots in the issue (min_translation).
translation_query: 'translator OR interpreter OR "localization specialist" OR subtitler OR "translation project manager" OR "post-editor" OR proofreader'
translation_tpr: "r604800"          # last 7 days
translation_gulf_locations:
  - "United Arab Emirates"
  - "Saudi Arabia"
translation_remote_locations:
  - "Middle East"
  - "Worldwide"

# ---- Per-vacancy application pack ---------------------------------------
# Reused from the earlier GulfCareer platform. Pure templates: no AI, no key,
# no cost. Contact details come from Secrets (CV_NAME, CV_PHONE, DIGEST_TO),
# never from this public file. The evidence lines below are professional
# facts only — no employer names, no contact details. Delete any you dislike.
cover_letter:
  enabled: true
  languages: ["en", "ar"]
  linkedin_message: true
  ats_keywords: true
  max_letters: 20
  years_experience: 6
  degrees: "My MA in Conference Interpreting and my degree in Law"
  evidence:
    admin:
      - "preparing and reviewing memoranda of association, powers of attorney and no-objection certificates"
      - "coordinating with clients to clarify requirements and deadlines"
      - "maintaining corporate records and official correspondence"
    legal_docs:
      - "drafting and reviewing contracts and official legal correspondence"
      - "translating contracts between English and Arabic without loss of legal meaning"
      - "controlling document versions, approvals and archiving"
    translation:
      - "translating contracts, official documents and published non-fiction between English and Arabic"
      - "conference interpreting, consecutive and simultaneous"
      - "terminology consistency, revision and linguistic quality control"
    language:
      - "editorial quality control for a publishing house"
      - "translating and editing published books from English into Arabic"
      - "proofreading and maintaining consistency of style and terminology"
    coordination:
      - "acting as the point of contact between clients and internal teams"
      - "tracking requests to completion under deadline pressure"
      - "scheduling meetings and keeping records accurate"
  evidence_ar:
    admin:
      - "إعداد ومراجعة عقود التأسيس والوكالات ورسائل عدم الممانعة"
      - "التنسيق مع العملاء لتوضيح المتطلبات والمواعيد النهائية"
      - "حفظ السجلات الرسمية والمراسلات ومتابعتها"
    legal_docs:
