# ---- Gulf search targets (LinkedIn public search) ----
gulf_locations:
  - {name: "United Arab Emirates", weight: 10, pages: 2}
  - {name: "Saudi Arabia",         weight: 7,  pages: 2}
  - {name: "Qatar",                weight: 6,  pages: 1}
  - {name: "Kuwait",               weight: 5,  pages: 1}
  - {name: "Bahrain",              weight: 5,  pages: 1}
  - {name: "Oman",                 weight: 5,  pages: 1}

# One OR-query per location keeps the request count low, which avoids
# LinkedIn HTTP 429 rate limiting.
gulf_query: 'administrative OR "administrative assistant" OR translator OR translation OR paralegal OR "legal assistant" OR "document controller" OR "office administrator" OR "executive assistant"'
gulf_tpr: "r86400"                  # last 24 hours

remote_query: 'translator OR translation OR "administrative assistant" OR "document controller" OR "legal assistant" OR proofreader OR "content writer"'
remote_tpr: "r604800"               # last 7 days
remote_locations:
  - "Middle East"
  - "Worldwide"

# ---- Free job sources ----
sources:
  linkedin:
    enabled: true
    gulf: true
    remote: true
    details: true                   # open the job page for verified seniority + description
  greenhouse:
    enabled: true
  lever:
    enabled: true
  remotive:
    enabled: true
    url: "https://remotive.com/api/remote-jobs?limit=100"
  remoteok:
    enabled: true
    url: "https://remoteok.com/api"
  himalayas:
    enabled: true
    url: "https://himalayas.app/jobs/api?limit=100"
  jobicy:
    enabled: true
    url: "https://jobicy.com/api/v2/remote-jobs?count=50"
  arbeitnow:
    enabled: true
    url: "https://www.arbeitnow.com/api/job-board-api"
  weworkremotely:
    enabled: true
    feeds:
      - "https://weworkremotely.com/categories/remote-customer-support-jobs.rss"
      - "https://weworkremotely.com/categories/remote-writing-jobs.rss"
      - "https://weworkremotely.com/categories/remote-management-and-finance-jobs.rss"
      - "https://weworkremotely.com/categories/remote-all-other-jobs.rss"

# ---- Direct company career boards (Gulf) --------------------------------
# Stable, key-free, and not rate-limited. Reused from the earlier
# GulfCareer platform; only boards that actually list Gulf roles are kept.
company_boards:
  greenhouse:
    - {slug: "tamara",    name: "Tamara"}
    - {slug: "careem",    name: "Careem"}
    - {slug: "deliveroo", name: "Deliveroo"}
  lever:
    - {slug: "aldar",     name: "Aldar Properties"}

# ---- Manual search links -------------------------------------------------
# Bayt / GulfTalent / Naukrigulf / Indeed block automated access (HTTP 403),
# so instead of pretending to scrape them we hand over a ready-made search
# link for each. One click, already filtered for your role and location.
portal_links:
  - name: "Bayt.com"
    url: "https://www.bayt.com/en/uae/jobs/administrative-jobs/"
  - name: "GulfTalent"
    url: "https://www.gulftalent.com/uae/jobs/title/administration"
  - name: "Naukrigulf"
    url: "https://www.naukrigulf.com/administrative-jobs-in-uae"
  - name: "Dubizzle Jobs"
    url: "https://dubai.dubizzle.com/jobs/administration/"
  - name: "LinkedIn — Easy Apply"
    url: "https://www.linkedin.com/jobs/search/?keywords=%22administrative%20officer%22%20OR%20%22document%20controller%22%20OR%20translator&location=United%20Arab%20Emirates&f_TPR=r86400&f_AL=true"
