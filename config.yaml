      - "ترجمة العقود بين العربية والإنجليزية دون إخلال بالمعنى القانوني"
      - "ضبط نسخ المستندات والاعتمادات والأرشفة"
    translation:
      - "ترجمة العقود والوثائق الرسمية والكتب غير الروائية بين الإنجليزية والعربية"
      - "الترجمة الفورية والتتبعية وترجمة المؤتمرات"
      - "توحيد المصطلحات والمراجعة وضبط الجودة اللغوية"
