# ============================================================
# Daily Job Brief — configuration
# Zero-cost: public job APIs + LinkedIn public search + Gmail SMTP.
# No personal contact details here (this repo is public).
# Recipient address lives in GitHub Secrets (DIGEST_TO).
# ============================================================

settings:
  timezone: "Asia/Dubai"
  send_time_local: "05:00"          # informational; cron in the workflow controls the run
  hours_window: 48                  # Gulf: only jobs posted within this window
  remote_hours_window: 168          # remote boards post less often: 7 days
  max_items: 20                     # total jobs per issue
  max_gulf: 12                      # cap for Gulf onsite/hybrid
  max_remote: 8                     # cap for remote worldwide
  max_per_company: 2                # avoid one employer filling the brief
  min_translation: 4                # reserved slots for professional translation/interpreting
  min_score: 30                     # relevance floor (0-100)
  request_timeout: 25
  linkedin_pause: 2.5               # seconds between LinkedIn calls (avoid HTTP 429)
  linkedin_retries: 2               # retries with backoff when rate-limited
  detail_limit: 26                  # top candidates to open for full description + seniority
  applied_file: "data/applied_ids.json"   # jobs already applied to — never shown again
  seen_file: "data/seen_ids.json"         # jobs already sent to you — never repeated
  repeat_suppression: true
  company_board_hours_window: 336   # company boards keep ads open for weeks: 14 days
  translation_hours_window: 168     # translation vacancies are scarcer: 7 days
  detail_pause: 4.0                 # slower pacing for the job-detail calls
  detail_cooldown: 15               # rest after the search phase before opening details
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"

email:
  subject_prefix: "فرص العمل اليومية | Daily Job Brief"
  from_name: "Daily Job Brief"

